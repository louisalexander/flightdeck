<!-- flightdeck: brand marks in the chrome. jekyll-theme-primer includes this
     file verbatim, so it is the one hook for tags the theme does not emit. -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/brand/flightdeck-avatar.svg' | relative_url }}">
<link rel="alternate icon" type="image/png" href="{{ '/assets/brand/flightdeck-avatar-512.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/brand/flightdeck-avatar-512.png' | relative_url }}">
<!-- Night, so mobile browser chrome joins the console field instead of
     framing it in white. -->
<meta name="theme-color" content="#020304">
<meta name="color-scheme" content="dark">
