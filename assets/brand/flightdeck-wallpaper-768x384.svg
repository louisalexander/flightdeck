<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 384" role="img" aria-labelledby="title desc">
  <title id="title">Flightdeck Stream Deck XL sleep wallpaper</title>
  <desc id="desc">The Silent Boot splash letterboxed to the Stream Deck XL panel, shown while the deck sleeps.</desc>
  <!--
    Panel-shaped twin of flightdeck-splash-800x480.svg, carrying exactly the
    geometry plugin/src/splash.ts applies per key: the 800x480 source scaled
    0.8 to 640x384 and centred, leaving a 64px Night bar on each side. There
    is no vertical letterbox, because 480 * 0.8 is 384 exactly.

    Kept identical on purpose. The boot splash and the sleep wallpaper are the
    same image at two moments, so the deck must not shift the artwork when it
    falls asleep. tools/check-wallpaper.mjs asserts this pixel for pixel
    against the assembled per-key tiles.

    Note for editors: this is XML, so a double hyphen may never appear inside
    a comment. The repo's prose style uses one as an em dash; here it makes
    the file unparseable and the wallpaper silently fails to load.
  -->
  <rect width="768" height="384" fill="#020304"/>
  <g transform="translate(64 0) scale(.8)">
    <rect width="800" height="480" fill="#020304"/>
    <g transform="translate(310 76) scale(.7)">
      <path d="M130 20 212 186 130 152 48 186Z" fill="#0C131D" stroke="#EEF5FF" stroke-width="15" stroke-linejoin="round"/>
      <path d="M130 20V152" fill="none" stroke="#1256A3" stroke-width="15"/>
      <circle cx="130" cy="152" r="15" fill="#F5A623"/>
      <circle cx="130" cy="152" r="32" fill="none" stroke="#F5A623" stroke-width="3" opacity=".22"/>
    </g>
    <text x="400" y="305" text-anchor="middle" fill="#EEF5FF" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="39" font-weight="600" letter-spacing="12">FLIGHTDECK</text>
    <text x="400" y="346" text-anchor="middle" fill="#617083" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="5">FLEET CONTROL</text>
    <rect x="310" y="393" width="180" height="3" rx="1.5" fill="#18212D"/>
    <rect x="310" y="393" width="118" height="3" rx="1.5" fill="#1256A3"/>
    <circle cx="428" cy="394.5" r="5" fill="#F5A623"/>
  </g>
</svg>
