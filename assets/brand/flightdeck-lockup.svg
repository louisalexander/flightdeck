<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Flightdeck horizontal lockup</title>
  <desc id="desc">The Flightdeck Beacon mark beside the Flightdeck wordmark.</desc>
  <rect width="1200" height="360" fill="#020304"/>
  <g transform="translate(68 40) scale(.55)">
    <path d="M256 46 456 442 256 360 56 442Z" fill="#0C131D" stroke="#EEF5FF" stroke-width="42" stroke-linejoin="round"/>
    <path d="M256 46V360" fill="none" stroke="#1256A3" stroke-width="42"/>
    <circle cx="256" cy="360" r="42" fill="#F5A623"/>
  </g>
  <text x="410" y="191" fill="#EEF5FF" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="90" font-weight="600" letter-spacing="17">FLIGHTDECK</text>
  <text x="416" y="242" fill="#617083" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" letter-spacing="9">FLEET CONTROL</text>
</svg>
