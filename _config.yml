title: flightdeck
description: An annunciator panel for a fleet of parallel Claude Code agents.
theme: jekyll-theme-primer

# Brand palette and usage rules: assets/brand/README.md
# The site's colours are overridden in assets/css/style.scss.
image: /assets/brand/flightdeck-social-preview-1280x640.png
